<!doctype html><html><head><meta charset="utf-8"><style>
@page { size: 500px 400px; margin: 0 } body { margin: 0; width: 500px; height: 400px; font: 12px Arial; padding: 24px; box-sizing: border-box; position: relative }
h2 { font-size: 16px; margin: 0 0 8px } ul, ol { margin: 0 0 14px; padding-left: 20px } li { margin: 0 0 4px }
.vec { position: absolute; left: 24px; top: 250px; width: 440px }
.vec p { margin: 0 0 6px 16px; position: relative }
</style></head><body>
<h2>Glyph bullets</h2>
<ul><li>First bullet item with <b>bold</b> text that goes on long enough to wrap onto a second line for testing purposes</li><li>Second bullet item</li><li>Third one</li></ul>
<ol><li>Step one</li><li>Step two</li></ol>
<div class="vec"><h2>Vector bullets</h2>
<svg width="440" height="90" style="position:absolute;left:0;top:26px"><circle cx="6" cy="8" r="2.2"/><circle cx="6" cy="26" r="2.2"/><circle cx="6" cy="62" r="2.2"/><rect x="200" y="20" width="30" height="1"/></svg>
<p style="margin-top:0">Vector dot item one</p><p>Vector dot item two<br>which wraps to a second line</p><p>Vector dot item three</p></div>
</body></html>
